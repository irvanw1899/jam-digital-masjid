      <stop offset="0" stop-color="#081622"/>
      <stop offset=".56" stop-color="#12322f"/>
      <stop offset="1" stop-color="#071411"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy=".72" r=".7">
      <stop offset="0" stop-color="#d8a54b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d8a54b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#10201f" stop-opacity=".89"/>
      <stop offset="1" stop-color="#091311" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe4a0"/>
      <stop offset="1" stop-color="#d79c3a"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
